name: Build Extension

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the release job, on version tags, can write
permissions:
  contents: read

# Actions are pinned to commits: a tag can be moved to other code
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create build directory
        run: mkdir -p build

      # ==================
      # Chrome / Edge Build
      # ==================
      - name: Build Chrome/Edge extension
        run: |
          mkdir -p build/chrome
          
          # Copy all extension files
          cp -r icons fonts build/chrome/
          cp popup.html popup.js filepicker.html filepicker.js background.js ntfy.js zip.js markdown.js emojis.js styles.css build/chrome/
          
          # Create Chrome-specific manifest (remove Firefox-specific settings)
          node build-manifest.js chrome > build/chrome/manifest.json
          
          # Create ZIP for Chrome Web Store / Edge Add-ons
          cd build/chrome
          zip -r ../send-to-ntfy-chrome-v${{ steps.version.outputs.version }}.zip .

      # ==================
      # Firefox Build
      # ==================
      - name: Build Firefox extension
        run: |
          mkdir -p build/firefox
          
          # Copy all extension files
          cp -r icons fonts build/firefox/
          cp popup.html popup.js filepicker.html filepicker.js background.js ntfy.js zip.js markdown.js emojis.js styles.css build/firefox/
          
          # Create Firefox-specific manifest (uses scripts instead of service_worker)
          node build-manifest.js firefox > build/firefox/manifest.json
          
          # Create XPI for Firefox (it's just a ZIP with .xpi extension)
          cd build/firefox
          zip -r ../send-to-ntfy-firefox-v${{ steps.version.outputs.version }}.xpi .

      # ==================
      # Upload Artifacts
      # ==================
      - name: Upload Chrome/Edge extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-edge-extension
          path: build/send-to-ntfy-chrome-v${{ steps.version.outputs.version }}.zip

      - name: Upload Firefox extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firefox-extension
          path: build/send-to-ntfy-firefox-v${{ steps.version.outputs.version }}.xpi

  # ==================
  # Create Release (on tag push)
  # ==================
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download extensions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: build
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            build/send-to-ntfy-chrome-v${{ needs.build.outputs.version }}.zip
            build/send-to-ntfy-firefox-v${{ needs.build.outputs.version }}.xpi
          generate_release_notes: true
